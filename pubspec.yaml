name: telega2
description: "A Telegram client built with Flutter and TDLib using Gateway API authentication"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffi: ^2.1.0
  path_provider: ^2.1.0
  flutter_riverpod: ^2.6.1
  mobile_scanner: ^6.0.0
  shared_preferences: ^2.2.0
  path: ^1.8.0
  country_picker: ^2.0.26
  logger: ^2.0.2+1
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  lottie: ^3.2.0
  file_picker: ^10.3.10
  image_picker: ^1.1.2
  media_kit: ^1.2.6
  media_kit_video: ^1.3.2
  media_kit_libs_video: ^1.0.7
  url_launcher: ^6.2.5
  photo_manager: ^3.5.0
  photo_manager_image_provider: ^2.2.0
  extended_image: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # - .env   <-- حذف شد (فایل وجود نداشت و باعث warning می‌شد)
    - assets/icon.png
    - assets/emoji/
