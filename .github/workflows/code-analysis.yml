name: 📊 Code Analysis - Find all Dart/Flutter errors

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'     # نسخه مشخص و پایدار
          channel: 'stable'
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            build/
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get dependencies
        run: flutter pub get

      - name: Run flutter analyze (strict)
        id: flutter_analyze
        continue-on-error: true
        run: |
          flutter analyze --fatal-infos --fatal-warnings > flutter_analysis_output.txt 2>&1
          cat flutter_analysis_output.txt

      - name: Upload analysis report
        uses: actions/upload-artifact@v4
        with:
          name: analysis-report
          path: flutter_analysis_output.txt
          retention-days: 7

      - name: Check for errors and fail if found
        run: |
          if grep -q "error •" flutter_analysis_output.txt; then
            echo "❌ Flutter analysis found errors. See artifact for details."
            exit 1
          fi
          echo "✅ No critical errors found."
