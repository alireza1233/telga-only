name: 🧪 TEST BUILD - Check if app compiles

on:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # برای commit کردن APK به مخزن

    steps:
      - name: Checkout the repository (telga-only)
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Enable Flutter desktop (for Windows) - optional, just Android is enough
        run: |
          flutter config --enable-android
          flutter pub get

      - name: Build Android APK (debug)
        run: |
          flutter build apk --debug

      - name: Create my-build directory in root
        run: |
          mkdir -p my-build
          cp build/app/outputs/flutter-apk/app-debug.apk my-build/app-debug.apk

      - name: Commit and push the APK to the main branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add my-build/app-debug.apk -f
          git commit -m "Add test APK from workflow [skip ci]" || echo "No changes to commit"
          git push
