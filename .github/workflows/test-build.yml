name: 🧪 TEST BUILD - Check if app compiles

on:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Setup Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean everything (remove lock, cache, build)
        run: |
          Remove-Item -Force pubspec.lock -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force .dart_tool -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force build -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:USERPROFILE\.gradle\caches" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK (debug)
        run: flutter build apk --debug

      - name: Create my-build directory
        run: |
          mkdir my-build
          copy build\app\outputs\flutter-apk\app-debug.apk my-build\app-debug.apk
        shell: cmd

      - name: Commit and push the APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add my-build/app-debug.apk -f
          git commit -m "Add test APK from workflow [skip ci]" || echo "No changes"
          git push
        shell: bash
