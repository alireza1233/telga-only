name: 🧪 TEST BUILD - Check if app compiles

on:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the repository (telga-only)
        uses: actions/checkout@v4

      - name: Setup Flutter stable (with Dart >=3.11)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK (debug)
        run: flutter build apk --debug

      - name: Create my-build directory
        run: |
          mkdir -p my-build
          cp build/app/outputs/flutter-apk/app-debug.apk my-build/app-debug.apk

      - name: Commit and push the APK
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add my-build/app-debug.apk -f
          git commit -m "Add test APK from workflow [skip ci]" || echo "No changes"
          git push
