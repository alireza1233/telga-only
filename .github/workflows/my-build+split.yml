name: 🧪 TEST BUILD - Check if app compiles (with split)

on:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Setup Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Clean Flutter build
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK (debug)
        run: flutter build apk --debug

      - name: Split APK into 90MB chunks
        shell: bash
        run: |
          mkdir -p my-splits
          # مسیر فایل APK ساخته شده
          APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          # تیکه‌ها 90 مگابایت
          split -b 90m "$APK_PATH" "my-splits/app-debug.apk.part_"
          
          # یه فایل متنی که توضیح بده چطور دوباره فایل رو به دست بیاری
          cat > "my-splits/README.txt" << 'EOF'
          How to Reassemble the APK:
          1. Download ALL these part files (app-debug.apk.part_aa, part_ab, ...) into the same folder.
          2. Open a terminal in that folder.
          3. Run the following command to combine them into the original APK:
          
          cat app-debug.apk.part_* > app-reassembled.apk
          EOF

      - name: Commit and push the split files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add my-splits/ -f
          git commit -m "Add APK split into 90MB chunks [skip ci]" || echo "No changes to commit"
          git push
