name: 🔥 OFFLINE BUNDLE for Telga (Android + Windows)

on: workflow_dispatch

jobs:
  build-offline:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout current repo (alireza1233/telga-only)
        uses: actions/checkout@v4

      - name: Setup Flutter stable 3.24.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Setup JDK 11, 17, 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            11
            17
            21
          java-package: jdk

      - name: Install full Android SDK
        shell: pwsh
        run: |
          $androidHome = "$env:LOCALAPPDATA\Android\Sdk"
          $env:ANDROID_HOME = $androidHome
          $env:ANDROID_SDK_ROOT = $androidHome
          mkdir -Force $androidHome | Out-Null

          $toolsDir = "$androidHome\cmdline-tools"
          $latestDir = "$toolsDir\latest"
          $sdkmanagerPath = "$latestDir\bin\sdkmanager.bat"

          if (!(Test-Path $sdkmanagerPath)) {
            Write-Host "Downloading command line tools..."
            $zipFile = "sdk-tools.zip"
            curl -o $zipFile https://dl.google.com/android/repository/commandlinetools-win-11076708_latest.zip
            $tempExtract = Join-Path $env:TEMP "cmdline-tools-extract"
            Remove-Item -Path $tempExtract -Recurse -Force -ErrorAction SilentlyContinue
            Expand-Archive -Path $zipFile -DestinationPath $tempExtract -Force

            $sdkmanagerFile = Get-ChildItem -Path $tempExtract -Recurse -Filter "sdkmanager.bat" | Select-Object -First 1
            if (-not $sdkmanagerFile) {
              Write-Error "sdkmanager.bat not found"
              exit 1
            }

            New-Item -ItemType Directory -Path $latestDir -Force | Out-Null
            $sourceRoot = $sdkmanagerFile.Directory.Parent
            Copy-Item -Path "$($sourceRoot.FullName)\*" -Destination $latestDir -Recurse -Force

            Remove-Item $zipFile -Force
            Remove-Item $tempExtract -Recurse -Force
          }

          $sdkmanager = "$latestDir\bin\sdkmanager.bat"
          for ($i=0; $i -lt 10; $i++) { echo y | & $sdkmanager --licenses 2>&1 > $null }

          $platforms = 21..35 | ForEach-Object { "platforms;android-$_" }
          $buildTools = @("35.0.0","34.0.0","33.0.2","33.0.1","33.0.0","32.0.0","31.0.0","30.0.3","29.0.3","28.0.3","27.0.3","26.0.3","25.0.3","24.0.3","23.0.3") | ForEach-Object { "build-tools;$_" }
          $ndks = @("26.3.11579264","27.0.12077973","25.2.9519653","23.2.8568313","21.4.7075529") | ForEach-Object { "ndk;$_" }
          $other = @("cmake;3.22.1","emulator","extras;google;m2repository","extras;android;m2repository","platform-tools")
          $allPackages = $platforms + $buildTools + $ndks + $other
          $batchSize = 20
          for ($i=0; $i -lt $allPackages.Count; $i += $batchSize) {
            $batch = $allPackages[$i..($i+$batchSize-1)] -join " "
            Write-Host "Installing $batch"
            & $sdkmanager $batch --verbose
          }
          & $sdkmanager --list

      - name: Install Visual Studio Build Tools + Windows SDK
        shell: pwsh
        run: |
          choco install visualstudio2022buildtools -y --no-progress
          choco install visualstudio2022-workload-vctools -y --no-progress

      - name: Pre-cache Gradle distributions and common plugins
        shell: pwsh
        run: |
          $gradleUserHome = "$env:USERPROFILE\.gradle"
          mkdir -Force "$gradleUserHome\wrapper\dists" | Out-Null
          $versions = @("6.5","6.6.1","6.7.1","6.8.3","6.9.4","7.0.2","7.1.1","7.2","7.3.3","7.4.2","7.5.1","7.6.4","8.0.2","8.1.1","8.2.1","8.3","8.4","8.5","8.6","8.7")
          foreach ($ver in $versions) {
            $url = "https://services.gradle.org/distributions/gradle-$ver-bin.zip"
            $dest = "$gradleUserHome\wrapper\dists\gradle-$ver-bin"
            mkdir -Force $dest -ErrorAction SilentlyContinue
            $zipFile = "$dest\gradle-$ver-bin.zip"
            if (!(Test-Path $zipFile)) {
              curl -L -o $zipFile $url
              Expand-Archive -Path $zipFile -DestinationPath $dest -Force
            }
          }

          New-Item -ItemType Directory -Path "gradle-cache-builder" -Force | Out-Null
          Set-Location "gradle-cache-builder"
          Copy-Item -Path "../gradlew" -Destination "." -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "../gradlew.bat" -Destination "." -Force -ErrorAction SilentlyContinue
          Copy-Item -Path "../gradle" -Destination "." -Recurse -Force -ErrorAction SilentlyContinue

          $gradleBuildScript = @"
          buildscript {
              repositories { mavenCentral() google() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.0'
                  classpath 'com.google.gms:google-services:4.4.0'
                  classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { mavenCentral() google() } }
          "@
          $gradleBuildScript | Out-File -FilePath "build.gradle" -Encoding ascii
          New-Item -ItemType Directory -Path "app" -Force | Out-Null

          if (Test-Path ".\gradlew.bat") { .\gradlew --no-daemon dependencies > $null 2>&1 }
          Set-Location ..

      - name: Generate code with build_runner (Riverpod & Hive)
        run: |
          flutter pub get
          flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build Android and Windows (debug & release)
        run: |
          flutter build apk --debug
          flutter build apk --release
          flutter build windows --debug
          flutter build windows --release

      - name: Assemble ultimate offline folder
        shell: pwsh
        run: |
          $target = "telga-offline-full"
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          Copy-Item -Path "$env:FLUTTER_ROOT" -Destination "$target\flutter" -Recurse -Force
          Copy-Item -Path "$env:LOCALAPPDATA\Android\Sdk" -Destination "$target\android-sdk" -Recurse -Force

          $javaCache = "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk"
          if (Test-Path $javaCache) {
            Copy-Item -Path $javaCache -Destination "$target\jdks" -Recurse -Force
          } else {
            Copy-Item -Path "$env:JAVA_HOME" -Destination "$target\jdk-17" -Recurse -Force
          }

          Copy-Item -Path "$env:USERPROFILE\.gradle" -Destination "$target\.gradle" -Recurse -Force -ErrorAction SilentlyContinue

          $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          Copy-Item -Path $pubCache -Destination "$target\pub-cache" -Recurse -Force

          Copy-Item -Path "$env:USERPROFILE\.android" -Destination "$target\.android" -Recurse -Force -ErrorAction SilentlyContinue

          $msvcFolder = "C:\Program Files\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC"
          $winKits = "C:\Program Files (x86)\Windows Kits\10"
          if (Test-Path $msvcFolder) { Copy-Item -Path $msvcFolder -Destination "$target\MSVC" -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path $winKits) { Copy-Item -Path $winKits -Destination "$target\WindowsKits" -Recurse -Force -ErrorAction SilentlyContinue }

          Copy-Item -Path "." -Destination "$target\source_code" -Recurse -Force -ErrorAction SilentlyContinue

          $setupBat = @"
          @echo off
          set ANDROID_HOME=%~dp0android-sdk
          set ANDROID_SDK_ROOT=%~dp0android-sdk
          set GRADLE_USER_HOME=%~dp0\.gradle
          set PUB_CACHE=%~dp0pub-cache
          set FLUTTER_ROOT=%~dp0flutter
          for /d %%i in ("%~dp0jdks\17*") do set JAVA_HOME=%%i
          set PATH=%FLUTTER_ROOT%\bin;%JAVA_HOME%\bin;%ANDROID_HOME%\platform-tools;%ANDROID_HOME%\cmdline-tools\latest\bin;%PATH%
          echo Telga offline environment ready.
          "@
          $setupBat | Out-File -FilePath "$target\setup.bat" -Encoding ascii

          Write-Host "Collected in $target"

      - name: Create 7z archive
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=9 -md=64m -mmt=on "telga-offline.7z" ".\telga-offline-full\"

      - name: Split & upload to release
        shell: bash
        run: |
          split -b 1800M -a 2 -d --verbose telga-offline.7z "telga-offline.7z.part"
          echo "RELEASE_TAG=offline-telga-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
          gh release create ${{ env.RELEASE_TAG }} --title "Telga Offline Bundle" --notes "Split parts, combine with 7z"
          for f in telga-offline.7z.part*; do
            gh release upload ${{ env.RELEASE_TAG }} "$f" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
