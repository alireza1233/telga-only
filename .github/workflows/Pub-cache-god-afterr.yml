name: 🔥 Full Build + Complete Pub Cache (No Mirrors)

on:
  workflow_dispatch:

jobs:
  build-and-upload-pub-cache:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: alireza1233/telga-only
          path: telga-project

      # ====================== پاک‌سازی کامل Mirror ======================
      - name: Remove all mirror environment variables
        shell: pwsh
        run: |
          Remove-Item -Path Env:PUB_HOSTED_URL -ErrorAction SilentlyContinue
          Remove-Item -Path Env:FLUTTER_STORAGE_BASE_URL -ErrorAction SilentlyContinue
          
          # برای قدم‌های بعدی هم پاک شود
          "PUB_HOSTED_URL=" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FLUTTER_STORAGE_BASE_URL=" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "✅ Mirrors removed successfully"

      - name: Setup Flutter 3.24.3 Stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true
          cache-key: flutter-3.24.3-${{ runner.os }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ====================== Build & Dependencies ======================
      - name: Clean and Get Dependencies (pub.dev)
        working-directory: ./telga-project
        run: |
          flutter clean
          flutter pub get --verbose

      - name: Build Android APK (Release)
        working-directory: ./telga-project
        run: flutter build apk --release

      - name: Build Windows Executable (Release)
        working-directory: ./telga-project
        run: flutter build windows --release

      - name: Run Build Runner (if exists)
        working-directory: ./telga-project
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs || echo "No build_runner needed or failed (ignored)"

      # ====================== Pub Cache Compression ======================
      - name: Get Pub Cache Path
        shell: pwsh
        run: |
          $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          echo "PUB_CACHE_PATH=$pubCache" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "Pub cache path: $pubCache"

      - name: Install 7-Zip
        run: choco install 7zip -y --no-progress

      - name: Compress Pub Cache (Ultra Compression)
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=9 -md=64m -mmt=on `
            -mfb=64 -mlc=8 -m0=LZMA2:d256m `
            "pub-cache-full.7z" "$env:PUB_CACHE_PATH" -bsp1

      - name: Test Archive Integrity
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" t "pub-cache-full.7z"
          if ($LASTEXITCODE -ne 0) { throw "Archive is corrupted!" }

      - name: Split Archive (1.8GB parts)
        shell: bash
        run: |
          split -b 1800M -a 2 -d --verbose pub-cache-full.7z pub-cache.7z.part
          ls -lh pub-cache.7z.part*

      # ====================== Release & Upload ======================
      - name: Create GitHub Release
        id: create_release
        shell: pwsh
        run: |
          $tag = "pub-cache-full-v$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          echo "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          
          gh release create $tag `
            --title "Complete Pub Cache (No Mirrors) - $tag" `
            --notes "دانلود تمام فایل‌های part، با دستور copy /b ترکیب کنید." `
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Split Parts
        shell: pwsh
        run: |
          Get-ChildItem -Filter "pub-cache.7z.part*" | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Combine Script
        shell: pwsh
        run: |
          $script = @"
          @echo off
          echo Combining parts...
          copy /b pub-cache.7z.part* pub-cache-full.7z
          echo Done! Extract with 7-Zip.
          echo After extraction, set environment variable:
          echo PUB_CACHE=C:\path\to\extracted\pub\cache
          pause
          "@
          $script | Out-File -FilePath "combine_pub_cache.bat" -Encoding ascii
          
          gh release upload $env:RELEASE_TAG "combine_pub_cache.bat" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
