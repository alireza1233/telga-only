name: ðŸ”¥ Full Build + Only Pub Cache (No Mirrors)

on:
  workflow_dispatch:

jobs:
  build-and-upload-pub-cache:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository (telga-only)
        uses: actions/checkout@v4
        with:
          repository: alireza1233/telga-only
          path: telga-project

      - name: Remove any mirror environment variables (global)
        run: |
          echo "PUB_HOSTED_URL=" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "FLUTTER_STORAGE_BASE_URL=" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Setup Flutter stable (3.24.3)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean and get dependencies (direct from pub.dev)
        working-directory: ./telga-project
        run: |
          flutter clean
          flutter pub get --verbose

      - name: Build Android APK (release)
        working-directory: ./telga-project
        run: flutter build apk --release

      - name: Build Windows executable (release)
        working-directory: ./telga-project
        run: flutter build windows --release

      - name: Run code generator (if needed)
        working-directory: ./telga-project
        run: flutter pub run build_runner build --delete-conflicting-outputs || echo "No build_runner"

      - name: Activate extra global packages
        shell: pwsh
        run: |
          $extra = @(
            "build_runner", "riverpod_generator", "hive_generator", "flutter_gen_runner",
            "very_good_cli", "dart_style", "flutter_lints", "mockito", "sqflite_common_ffi",
            "path_provider", "shared_preferences", "dio", "get_it", "bloc", "flutter_bloc",
            "equatable", "json_serializable", "retrofit_generator", "freezed", "floor_generator",
            "drift_dev", "flutter_native_splash", "flutter_launcher_icons", "icons_launcher",
            "media_kit", "media_kit_video", "photo_manager", "image_picker", "lottie",
            "flutter_riverpod", "country_picker", "extended_image", "file_picker",
            "logger", "mobile_scanner", "url_launcher", "intl", "path", "ffi"
          )
          foreach ($pkg in $extra) {
            flutter pub global activate $pkg
          }

      - name: Get Pub Cache path
        id: cache-path
        run: |
          $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          echo "CACHE_PATH=$pubCache" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Install 7-Zip
        run: choco install 7zip -y --no-progress

      - name: Compress entire Pub Cache (max compression)
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=9 -md=64m -mmt=on "pub-cache-full.7z" "$env:CACHE_PATH" -bsp1 -bse1

      - name: Test archive integrity
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" t "pub-cache-full.7z"
          if ($LASTEXITCODE -ne 0) { throw "Archive corrupted!" }

      - name: Split archive into 1.8GB chunks
        shell: bash
        run: |
          split -b 1800M -a 2 -d --verbose pub-cache-full.7z "pub-cache.7z.part"
          ls -lh pub-cache.7z.part*

      - name: Create GitHub Release
        id: create_release
        run: |
          $tag = "pub-cache-full-v$((Get-Date -Format 'yyyyMMdd-HHmmss'))"
          echo "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          gh release create $tag --title "ðŸ“¦ Complete Pub Cache (no mirrors, full build)" --notes "Download all .part files, combine with copy /b, extract with 7-Zip, then set PUB_CACHE environment variable." --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      - name: Upload split parts
        run: |
          Get-ChildItem -Filter "pub-cache.7z.part*" | ForEach-Object {
            gh release upload $env:RELEASE_TAG "$($_.FullName)" --clobber --repo "${{ github.repository }}"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      - name: Upload combine script
        run: |
          $combineScript = @"
          @echo off
          echo Combining parts into pub-cache-full.7z ...
          copy /b pub-cache.7z.part* pub-cache-full.7z
          echo Done. Extract with 7-Zip, then set PUB_CACHE=extracted_folder_path
          pause
          "@
          $combineScript | Out-File -FilePath "combine_pub_cache.bat" -Encoding ascii
          gh release upload $env:RELEASE_TAG "combine_pub_cache.bat" --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
