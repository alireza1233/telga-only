name: 🔄 Incremental Offline Bundle (Only Changed Parts)

on: workflow_dispatch

jobs:
  build-and-package-changes:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout telga-only project
        uses: actions/checkout@v4
        with:
          repository: alireza1233/telga-only
          path: telga-only

      - name: Setup Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: jdk

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Enable Windows desktop support for the project
        shell: pwsh
        run: |
          cd telga-only
          flutter config --enable-windows-desktop
          flutter create --platforms=windows .
          cd ..

      - name: Build project to populate caches
        shell: pwsh
        run: |
          cd telga-only
          flutter pub get
          flutter build apk --debug
          flutter build apk --release
          flutter build windows --debug
          flutter build windows --release
          cd ..

      - name: Collect changed folders (gradle cache, pub-cache, Android SDK)
        shell: pwsh
        run: |
          $target = "offline-changes"
          New-Item -ItemType Directory -Force -Path $target | Out-Null

          $gradleHome = "$env:USERPROFILE\.gradle"
          if (Test-Path $gradleHome) {
            Copy-Item -Path $gradleHome -Destination "$target\.gradle" -Recurse -Force
          }

          $pubCache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          if (Test-Path $pubCache) {
            Copy-Item -Path $pubCache -Destination "$target\pub-cache" -Recurse -Force
          }

          $sdkPath = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { "$env:LOCALAPPDATA\Android\Sdk" }
          if (Test-Path $sdkPath) {
            Copy-Item -Path $sdkPath -Destination "$target\Sdk" -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress
          $env:PATH = "C:\Program Files\7-Zip;$env:PATH"

      - name: Create 7z archive
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=9 -md=64m -mmt=on "offline-changes.7z" ".\offline-changes\" -bsp1 -bse1

      - name: Split archive into 1.8GB parts
        shell: bash
        run: |
          split -b 1800M -a 2 -d --verbose offline-changes.7z "offline-changes.7z.part"
          ls -lh offline-changes.7z.part*

      - name: Create GitHub Release
        id: create_release
        run: |
          $tag = "incremental-changes-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          echo "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          gh release create $tag --title "Incremental Changes (Gradle cache, Pub cache, Android SDK)" --notes "Download all .part files, then combine and extract." --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      - name: Upload split parts
        run: |
          Get-ChildItem -Filter "offline-changes.7z.part*" | ForEach-Object {
            gh release upload $env:RELEASE_TAG "$($_.FullName)" --clobber --repo "${{ github.repository }}"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh

      - name: Upload combine script
        run: |
          $scriptContent = @"
          @echo off
          echo Combining split parts...
          copy /b offline-changes.7z.part* offline-changes-combined.7z
          echo Extracting...
          7z x offline-changes-combined.7z -y
          echo Done. You now have .gradle, pub-cache, and Sdk folders.
          pause
          "@
          $scriptContent | Out-File -FilePath "combine_and_extract.bat" -Encoding ascii
          gh release upload $env:RELEASE_TAG "combine_and_extract.bat" --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
